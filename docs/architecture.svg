<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="880" height="540" fill="#0d1117"/>
  <text x="440" y="26" font-size="14" fill="#c9d1d9" text-anchor="middle" font-weight="bold">$PICK — two contracts, one frozen parameter set</text>

  <!-- user -->
  <rect x="360" y="48" width="160" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="440" y="67" font-size="12" fill="#c9d1d9" text-anchor="middle">holder / wallet</text>
  <text x="440" y="83" font-size="10" fill="#8b949e" text-anchor="middle">stake · claim · mint</text>

  <!-- coin box -->
  <rect x="60" y="140" width="380" height="330" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="80" y="166" font-size="13" fill="#58a6ff" font-weight="bold">coin · pick_coin.wasm</text>
  <text x="80" y="184" font-size="10" fill="#8b949e">NEP-141 + NEP-145, no admin key, params frozen at deploy</text>

  <rect x="80" y="198" width="340" height="54" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="94" y="218" font-size="11" fill="#3fb950">transfer tax → treasury + burn</text>
  <text x="94" y="234" font-size="10" fill="#8b949e">ft_transfer · ft_transfer_call · storage_deposit</text>

  <rect x="80" y="262" width="340" height="54" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="94" y="282" font-size="11" fill="#3fb950">parimutuel events</text>
  <text x="94" y="298" font-size="10" fill="#8b949e">stake → resolve → settle/void → claim/refund</text>

  <rect x="80" y="326" width="340" height="54" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="94" y="346" font-size="11" fill="#3fb950">streaks · tiers · public log</text>
  <text x="94" y="362" font-size="10" fill="#8b949e">get_stats · leaderboard · history (mint/burn)</text>

  <rect x="80" y="390" width="340" height="60" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="94" y="410" font-size="11" fill="#d29922">escrow invariant</text>
  <text x="94" y="426" font-size="10" fill="#8b949e">balance[contract] ≥ open stakes + unclaimed pools</text>
  <text x="94" y="440" font-size="10" fill="#8b949e">asserted every step · randomized test, 300 rounds</text>

  <!-- passport box -->
  <rect x="500" y="140" width="320" height="240" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="520" y="166" font-size="13" fill="#d29922" font-weight="bold">passport · pick_passport.wasm</text>
  <text x="520" y="184" font-size="10" fill="#8b949e">soulbound NEP-171 · nft_transfer always panics</text>

  <rect x="520" y="198" width="280" height="54" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="534" y="218" font-size="11" fill="#3fb950">record_pick / record_result</text>
  <text x="534" y="234" font-size="10" fill="#8b949e">registrar = coin only; win mirrored at settle</text>

  <rect x="520" y="262" width="280" height="54" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="534" y="282" font-size="11" fill="#3fb950">tier perk gate</text>
  <text x="534" y="298" font-size="10" fill="#8b949e">coin reads tier before paying claim bonus</text>

  <rect x="520" y="326" width="280" height="40" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="534" y="344" font-size="11" fill="#3fb950">get_records / get_summary</text>
  <text x="534" y="358" font-size="10" fill="#8b949e">history view per NFT (track 10)</text>

  <!-- arrows -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arry" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#d29922"/>
    </marker>
  </defs>

  <line x1="440" y1="92" x2="250" y2="138" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="440" y1="92" x2="640" y2="138" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- coin -> passport: fire-and-forget mirrors -->
  <line x1="440" y1="250" x2="496" y2="250" stroke="#58a6ff" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrb)"/>
  <text x="468" y="242" font-size="9" fill="#58a6ff" text-anchor="middle">records</text>

  <!-- passport -> coin: registrar -->
  <line x1="500" y1="360" x2="444" y2="360" stroke="#d29922" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arry)"/>
  <text x="472" y="376" font-size="9" fill="#d29922" text-anchor="middle">registrar</text>

  <!-- bottom note -->
  <text x="440" y="496" font-size="10" fill="#8b949e" text-anchor="middle">resolver address frozen in Params at deploy — no admin key can change it · read everything with get_params</text>
  <text x="440" y="514" font-size="10" fill="#8b949e" text-anchor="middle">solid = synchronous in-contract logic · dashed blue = record mirrors (fire-and-forget, repair() self-heals)</text>
  <text x="440" y="530" font-size="10" fill="#8b949e" text-anchor="middle">dashed yellow = register_passport, one-shot from the passport contract</text>
</svg>
